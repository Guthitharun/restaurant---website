<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHIRATHA Family Restaurant, PAMUR | Print Review Standee</title>
  <meta name="application-name" content="ADHIRATHA Family Restaurant, PAMUR">
  <meta name="apple-mobile-web-app-title" content="ADHIRATHA Family Restaurant, PAMUR">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Outfit:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .qr-print-card {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(212,168,67,0.4);
      border-radius: 24px;
      padding: 50px 60px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,168,67,0.1);
      backdrop-filter: blur(16px);
    }

    .restaurant-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #d4a843, #f5c518);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .restaurant-sub {
      color: #888;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 32px;
    }

    .qr-box {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: 0 8px 30px rgba(212,168,67,0.3);
      margin-bottom: 28px;
    }

    #qr-output { display: block; }

    .qr-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: #d4a843;
      margin-bottom: 10px;
    }

    .qr-desc {
      color: #aaa;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 24px;
    }

    .stars i {
      color: #d4a843;
      font-size: 1.4rem;
    }

    .url-label {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 28px;
      font-family: monospace;
      word-break: break-all;
    }

    .print-btn {
      background: linear-gradient(135deg, #d4a843, #f5c518);
      color: #000;
      border: none;
      padding: 14px 40px;
      border-radius: 100px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 1px;
      margin-right: 12px;
      transition: all 0.2s;
    }

    .print-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(212,168,67,0.4);
    }

    .back-btn {
      background: transparent;
      color: #d4a843;
      border: 1px solid rgba(212,168,67,0.4);
      padding: 14px 30px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(212,168,67,0.1);
    }

    @media print {
      body { background: white; color: black; padding: 0; }
      .qr-print-card { border: 2px solid #d4a843; box-shadow: none; background: white; }
      .restaurant-name { -webkit-text-fill-color: #d4a843; }
      .print-btn, .back-btn { display: none; }
      .qr-desc, .qr-title, .stars { color: #333; }
    }
  </style>
</head>
<body>

  <div class="qr-print-card">
    <div class="restaurant-name">ADHIRATHA</div>
    <div class="restaurant-sub">Family Restaurant (AC) · Pamuru, AP</div>

    <div class="qr-box">
      <div id="qr-output"></div>
    </div>

    <div class="stars">
      <i class="fa-solid fa-star"></i>
      <i class="fa-solid fa-star"></i>
      <i class="fa-solid fa-star"></i>
      <i class="fa-solid fa-star"></i>
      <i class="fa-solid fa-star"></i>
    </div>

    <div class="qr-title">Rate Our Food!</div>
    <div class="qr-desc">
      Scan this QR code with your phone camera to visit our review page.<br>
      Rate each dish from 1–5 stars and share your experience!
    </div>

    <div class="url-label" id="qr-url-label">Loading URL...</div>

    <button class="print-btn" onclick="window.print()">
      <i class="fa-solid fa-print"></i> Print QR Code
    </button>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const reviewURL = window.location.origin +
      window.location.pathname.replace('print_qr.html', '') + 'reviews.html';

    document.getElementById('qr-url-label').textContent = reviewURL;

    new QRCode(document.getElementById('qr-output'), {
      text: reviewURL,
      width: 220,
      height: 220,
      colorDark: '#0a0a0a',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
