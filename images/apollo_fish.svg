<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140806" />
      <stop offset="50%" stop-color="#2a1008" />
      <stop offset="100%" stop-color="#0a0302" />
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>
    <linearGradient id="fishGolden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22" />
      <stop offset="50%" stop-color="#d35400" />
      <stop offset="100%" stop-color="#962d00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#redGlow)" />

  <!-- Black Ceramic Plate -->
  <ellipse cx="300" cy="240" rx="190" ry="110" fill="url(#plateGrad)" stroke="#d4a843" stroke-width="2" filter="url(#shadow)" />
  <ellipse cx="300" cy="240" rx="160" ry="90" fill="#11181e" />

  <!-- Apollo Fish Fillet Chunks (Batter Fried in Spicy Red Marinade) -->
  <g filter="url(#shadow)">
    <!-- Chunk 1 -->
    <path d="M 200 220 Q 230 190 260 210 Q 250 240 210 240 Z" fill="url(#fishGolden)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Chunk 2 -->
    <path d="M 250 200 Q 290 180 320 210 Q 300 245 260 235 Z" fill="url(#fishGolden)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Chunk 3 -->
    <path d="M 310 210 Q 350 190 380 220 Q 360 250 320 245 Z" fill="url(#fishGolden)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Chunk 4 -->
    <path d="M 230 240 Q 270 230 300 260 Q 270 280 230 265 Z" fill="url(#fishGolden)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Chunk 5 -->
    <path d="M 290 245 Q 340 235 370 260 Q 340 285 300 275 Z" fill="url(#fishGolden)" stroke="#ff4d4d" stroke-width="1.5" />
  </g>

  <!-- Green Chilies & Curry Leaves Garnishing -->
  <path d="M 210 210 Q 240 200 235 225 M 310 230 Q 340 215 345 240 M 270 250 Q 300 240 295 265" stroke="#2ecc71" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="245" cy="225" r="3" fill="#ffffff" />
  <circle cx="320" cy="215" r="3.5" fill="#ffffff" />
  <circle cx="280" cy="245" r="3" fill="#ffffff" />

  <!-- Lemon Wedges -->
  <path d="M 390 210 Q 420 220 400 240 Z" fill="#f1c40f" stroke="#f39c12" stroke-width="2" />

  <!-- Onion Rings -->
  <ellipse cx="170" cy="240" rx="25" ry="15" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <ellipse cx="185" cy="250" rx="20" ry="12" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" />

  <!-- Title Badge -->
  <rect x="20" y="20" width="180" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🐟 APPOLO FISH</text>
</svg>
