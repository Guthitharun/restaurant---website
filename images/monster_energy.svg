<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a05" />
      <stop offset="50%" stop-color="#0c170c" />
      <stop offset="100%" stop-color="#030503" />
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="blackCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="25%" stop-color="#111111" />
      <stop offset="75%" stop-color="#222222" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#greenGlow)" />

  <ellipse cx="300" cy="355" rx="55" ry="14" fill="#000000" stroke="#2ecc71" stroke-width="1" opacity="0.8" filter="blur(6px)" />

  <!-- Can Top Rim -->
  <ellipse cx="300" cy="95" rx="45" ry="12" fill="#7f8c8d" stroke="#bdc3c7" stroke-width="2" />
  <ellipse cx="300" cy="95" rx="38" ry="8" fill="#333333" />

  <!-- Can Main Body -->
  <path d="M 255 95 L 345 95 L 345 330 Q 345 345 300 345 Q 255 345 255 330 Z" fill="url(#blackCan)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Monster Claw Logo (Neon Green) -->
  <path d="M 275 160 L 285 250 M 295 150 L 305 260 M 318 165 L 325 245" stroke="#2ecc71" stroke-width="10" stroke-linecap="round" fill="none" filter="drop-shadow(0 0 8px #2ecc71)" />

  <text x="300" y="285" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">MONSTER</text>
  <text x="300" y="300" font-family="'Arial', sans-serif" font-size="9" fill="#2ecc71" text-anchor="middle" letter-spacing="2">ENERGY</text>

  <!-- Title Badge -->
  <rect x="20" y="20" width="190" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🔋 MONSTER ENERGY</text>
</svg>
