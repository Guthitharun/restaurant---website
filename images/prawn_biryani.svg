<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140902" />
      <stop offset="50%" stop-color="#2d1505" />
      <stop offset="100%" stop-color="#0a0401" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="biryaniRice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b041" />
      <stop offset="50%" stop-color="#f4d03f" />
      <stop offset="100%" stop-color="#eb984e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#goldGlow)" />

  <!-- Royal Brass Handi Bowl -->
  <ellipse cx="300" cy="240" rx="200" ry="115" fill="#1c2833" stroke="#d4a843" stroke-width="3" filter="url(#shadow)" />
  <ellipse cx="300" cy="240" rx="180" ry="100" fill="url(#biryaniRice)" />

  <!-- Biryani Basmati Grains Pattern -->
  <path d="M 180 200 Q 300 160 420 200 Q 400 280 180 260 Z" fill="#fff9e6" opacity="0.6" />

  <!-- Spiced Sautéed Prawns on Top of Biryani Rice -->
  <path d="M 230 200 C 210 215 240 235 260 220 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1" />
  <path d="M 290 190 C 270 205 300 225 320 210 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1" />
  <path d="M 350 205 C 330 220 360 240 380 225 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1" />
  <path d="M 260 230 C 240 245 270 265 290 250 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1" />
  <path d="M 320 230 C 300 245 330 265 350 250 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1" />

  <!-- Fried Onions, Mint & Boiled Egg Half -->
  <ellipse cx="210" cy="235" rx="18" ry="12" fill="#ffffff" />
  <ellipse cx="210" cy="235" rx="10" ry="7" fill="#f1c40f" />

  <path d="M 230 220 Q 300 240 370 215" stroke="#27ae60" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="280" cy="215" r="3" fill="#d4a843" />
  <circle cx="340" cy="225" r="3" fill="#d4a843" />

  <!-- Title Badge -->
  <rect x="20" y="20" width="190" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🦐 PRAWN BIRYANI</text>
</svg>
