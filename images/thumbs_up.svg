<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#051c33" />
      <stop offset="100%" stop-color="#020812" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066cc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="25%" stop-color="rgba(20,10,5,0.95)" />
      <stop offset="75%" stop-color="rgba(35,15,5,0.9)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc0000" />
      <stop offset="50%" stop-color="#990000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#880000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#blueGlow)" />

  <!-- Ice Cubes in Background -->
  <rect x="140" y="240" width="55" height="55" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" transform="rotate(15 140 240)" />
  <rect x="400" y="220" width="60" height="60" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" transform="rotate(-20 400 220)" />

  <!-- Bottle Shadow -->
  <ellipse cx="300" cy="365" rx="55" ry="14" fill="#000000" opacity="0.9" filter="blur(6px)" />

  <!-- Bottle Body -->
  <path d="M 270 90 L 330 90 L 330 130 C 330 160 350 180 350 230 L 350 340 Q 350 355 330 355 L 270 355 Q 250 355 250 340 L 250 230 C 250 180 270 160 270 130 Z" fill="url(#glassBottle)" filter="url(#shadow)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Bottle Crown Cap -->
  <rect x="268" y="76" width="64" height="15" rx="3" fill="url(#capGrad)" stroke="#ffffff" stroke-width="1" />
  <line x1="272" y1="91" x2="272" y2="95" stroke="#ffffff" stroke-width="2" />
  <line x1="282" y1="91" x2="282" y2="95" stroke="#ffffff" stroke-width="2" />
  <line x1="292" y1="91" x2="292" y2="95" stroke="#ffffff" stroke-width="2" />
  <line x1="302" y1="91" x2="302" y2="95" stroke="#ffffff" stroke-width="2" />
  <line x1="312" y1="91" x2="312" y2="95" stroke="#ffffff" stroke-width="2" />
  <line x1="322" y1="91" x2="322" y2="95" stroke="#ffffff" stroke-width="2" />

  <!-- Label -->
  <path d="M 252 210 L 348 210 L 348 280 L 252 280 Z" fill="url(#labelGrad)" stroke="#d4a843" stroke-width="1.5" />
  <!-- Thums Up Logo Thums Icon -->
  <path d="M 285 245 C 285 235 295 230 300 230 C 305 230 315 235 315 245 L 315 260 L 285 260 Z" fill="#ffffff" />
  <text x="300" y="274" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-style="italic" fill="#ffffff" text-anchor="middle">THUMS UP</text>

  <!-- Condensation Water Drops on Bottle -->
  <circle cx="265" cy="150" r="2.5" fill="rgba(255,255,255,0.7)" />
  <circle cx="270" cy="170" r="3.5" fill="rgba(255,255,255,0.8)" />
  <circle cx="330" cy="160" r="3" fill="rgba(255,255,255,0.7)" />
  <circle cx="335" cy="230" r="4" fill="rgba(255,255,255,0.8)" />
  <circle cx="260" cy="300" r="3.5" fill="rgba(255,255,255,0.7)" />
  <circle cx="340" cy="320" r="3" fill="rgba(255,255,255,0.8)" />

  <!-- Glass Highlights -->
  <path d="M 260 140 Q 258 200 258 330" stroke="rgba(255,255,255,0.5)" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Title Overlay Badge -->
  <rect x="20" y="20" width="180" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🥤 THUMS UP</text>
</svg>
