<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140604" />
      <stop offset="50%" stop-color="#2a0d08" />
      <stop offset="100%" stop-color="#090201" />
    </linearGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="prawnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f50" />
      <stop offset="50%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#900c3f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#orangeGlow)" />

  <!-- Modern White Dish -->
  <ellipse cx="300" cy="245" rx="190" ry="105" fill="#f8f9f9" stroke="#d4a843" stroke-width="2.5" filter="url(#shadow)" />
  <ellipse cx="300" cy="245" rx="165" ry="85" fill="#eaeded" />

  <!-- Batter Fried Loose Prawns -->
  <g filter="url(#shadow)">
    <!-- Prawn 1 C-shape -->
    <path d="M 210 200 C 180 230 220 270 250 240 C 230 230 220 210 210 200 Z" fill="url(#prawnGrad)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Prawn 2 -->
    <path d="M 270 190 C 240 220 280 260 310 230 C 290 220 280 200 270 190 Z" fill="url(#prawnGrad)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Prawn 3 -->
    <path d="M 330 200 C 300 230 340 270 370 240 C 350 230 340 210 330 200 Z" fill="url(#prawnGrad)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Prawn 4 -->
    <path d="M 230 240 C 200 270 240 300 270 270 C 250 260 240 250 230 240 Z" fill="url(#prawnGrad)" stroke="#ff4d4d" stroke-width="1.5" />
    <!-- Prawn 5 -->
    <path d="M 300 240 C 270 270 310 300 340 270 C 320 260 310 250 300 240 Z" fill="url(#prawnGrad)" stroke="#ff4d4d" stroke-width="1.5" />
  </g>

  <!-- Spring Onions & Garlic Bits Garnishing -->
  <circle cx="230" cy="220" r="3" fill="#2ecc71" />
  <circle cx="280" cy="210" r="3.5" fill="#2ecc71" />
  <circle cx="340" cy="220" r="3" fill="#2ecc71" />
  <circle cx="260" cy="250" r="4" fill="#ffffff" />
  <circle cx="320" cy="255" r="3.5" fill="#ffffff" />
  <circle cx="290" cy="235" r="2.5" fill="#d4a843" />

  <!-- Title Badge -->
  <rect x="20" y="20" width="180" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🦐 LOOSE PRAWN</text>
</svg>
