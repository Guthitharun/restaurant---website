<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#182b4d" />
      <stop offset="100%" stop-color="#070c17" />
    </linearGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bdc3c7" />
      <stop offset="25%" stop-color="#2980b9" />
      <stop offset="50%" stop-color="#ecf0f1" />
      <stop offset="75%" stop-color="#2980b9" />
      <stop offset="100%" stop-color="#7f8c8d" />
    </linearGradient>
    <linearGradient id="yellowSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>
    <linearGradient id="bullRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Ice Cubes around Can -->
  <rect x="170" y="270" width="60" height="60" rx="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2" transform="rotate(-15 170 270)" />
  <rect x="370" y="260" width="65" height="65" rx="14" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="2" transform="rotate(25 370 260)" />

  <!-- Shadow -->
  <ellipse cx="300" cy="355" rx="60" ry="14" fill="#000000" opacity="0.9" filter="blur(6px)" />

  <!-- Can Shape -->
  <!-- Top Rim -->
  <ellipse cx="300" cy="100" rx="45" ry="12" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2" />
  <ellipse cx="300" cy="100" rx="38" ry="8" fill="#7f8c8d" />

  <!-- Can Main Body -->
  <path d="M 255 100 L 345 100 L 345 330 Q 345 345 300 345 Q 255 345 255 330 Z" fill="url(#canBody)" filter="url(#shadow)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Silver Bottom Rim -->
  <ellipse cx="300" cy="330" rx="45" ry="10" fill="#95a5a6" />

  <!-- Red Bull Logo Elements -->
  <!-- Yellow Sun Circle -->
  <circle cx="300" cy="220" r="30" fill="url(#yellowSun)" stroke="#ffffff" stroke-width="1" />

  <!-- Two Red Bulls Charging -->
  <path d="M 260 215 Q 280 205 295 220 L 285 225 Z" fill="url(#bullRed)" />
  <path d="M 340 215 Q 320 205 305 220 L 315 225 Z" fill="url(#bullRed)" />

  <!-- Text -->
  <text x="300" y="268" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#cc0000" text-anchor="middle" letter-spacing="2">RED BULL</text>
  <text x="300" y="285" font-family="'Arial', sans-serif" font-size="10" font-weight="700" fill="#2980b9" text-anchor="middle" letter-spacing="1">ENERGY DRINK</text>

  <!-- Water Condensation Drops -->
  <circle cx="265" cy="140" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="335" cy="170" r="3.5" fill="#ffffff" opacity="0.8" />
  <circle cx="270" cy="290" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Title Badge -->
  <rect x="20" y="20" width="180" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">⚡ RED BULL</text>
</svg>
