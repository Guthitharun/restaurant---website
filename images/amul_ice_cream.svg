<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c06" />
      <stop offset="50%" stop-color="#24160a" />
      <stop offset="100%" stop-color="#0a0502" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="vanilla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf0" />
      <stop offset="70%" stop-color="#f5eab8" />
      <stop offset="100%" stop-color="#dbcb83" />
    </linearGradient>
    <linearGradient id="chocolate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69391b" />
      <stop offset="70%" stop-color="#3d1e0b" />
      <stop offset="100%" stop-color="#210f04" />
    </linearGradient>
    <linearGradient id="cherry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="60%" stop-color="#c9082a" />
      <stop offset="100%" stop-color="#690011" />
    </linearGradient>
    <linearGradient id="sauce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#381907" />
      <stop offset="100%" stop-color="#1c0a02" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <rect width="600" height="400" fill="url(#spotlight)" />

  <!-- Shadow under glass -->
  <ellipse cx="300" cy="355" rx="110" ry="20" fill="#000000" opacity="0.8" filter="blur(8px)" />

  <!-- Glass Sundae Base -->
  <path d="M 250 350 L 350 350 L 330 340 L 308 260 L 292 260 L 270 340 Z" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#shadow)" />
  <ellipse cx="300" cy="350" rx="50" ry="8" fill="rgba(255,255,255,0.3)" />

  <!-- Glass Bowl -->
  <path d="M 210 180 Q 210 270 300 270 Q 390 270 390 180 Z" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="2" filter="url(#shadow)" />
  <ellipse cx="300" cy="180" rx="90" ry="16" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="2" />

  <!-- Ice Cream Scoops -->
  <!-- Scoop 1 (Chocolate - Left) -->
  <circle cx="260" cy="165" r="45" fill="url(#chocolate)" />
  <!-- Scoop 2 (Vanilla - Right) -->
  <circle cx="340" cy="160" r="48" fill="url(#vanilla)" />
  <!-- Scoop 3 (Center Top - Mixed) -->
  <circle cx="300" cy="130" r="50" fill="url(#vanilla)" filter="url(#shadow)" />
  <path d="M 265 125 C 275 100, 315 100, 335 125 C 310 145, 280 140, 265 125 Z" fill="url(#chocolate)" opacity="0.9" />

  <!-- Chocolate Sauce Drizzle -->
  <path d="M 270 115 Q 285 140 280 180 M 310 100 Q 320 135 325 175 M 335 110 Q 355 130 350 165" stroke="url(#sauce)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95" />
  <circle cx="280" cy="183" r="3.5" fill="#240e03" />
  <circle cx="325" cy="178" r="4" fill="#240e03" />

  <!-- Sprinkles & Nuts -->
  <circle cx="285" cy="110" r="3" fill="#d4a843" />
  <circle cx="315" cy="115" r="3.5" fill="#e74c3c" />
  <circle cx="330" cy="102" r="3" fill="#ffffff" />
  <circle cx="270" cy="135" r="2.5" fill="#d4a843" />
  <circle cx="340" cy="130" r="3" fill="#2ecc71" />

  <!-- Whipped Cream Swirl -->
  <path d="M 285 95 C 285 75 315 75 315 95 C 325 80 300 60 295 55 C 290 60 275 80 285 95 Z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Cherry on Top -->
  <circle cx="298" cy="52" r="14" fill="url(#cherry)" filter="url(#glow)" />
  <!-- Cherry Stem -->
  <path d="M 298 40 Q 315 20 330 25" stroke="#3d6e1d" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Cherry Highlight -->
  <circle cx="293" cy="47" r="3.5" fill="#ffffff" opacity="0.7" />

  <!-- Glass Shine Highlights -->
  <path d="M 220 190 Q 225 240 270 260" stroke="rgba(255,255,255,0.6)" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="220" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🍨 AMUL ICE CREAM</text>
</svg>
