<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140702" />
      <stop offset="50%" stop-color="#2d0e04" />
      <stop offset="100%" stop-color="#0a0301" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="copperBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d35400" />
      <stop offset="50%" stop-color="#a04000" />
      <stop offset="100%" stop-color="#6e2c00" />
    </linearGradient>
    <linearGradient id="curryGravy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="50%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#900c3f" />
    </linearGradient>
    <linearGradient id="prawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f50" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#goldGlow)" />

  <ellipse cx="300" cy="355" rx="80" ry="18" fill="#000000" opacity="0.85" filter="blur(6px)" />

  <!-- Indian Traditional Handi / Copper Gravy Bowl -->
  <path d="M 210 170 Q 170 250 210 330 Q 300 365 390 330 Q 430 250 390 170 Z" fill="url(#copperBowl)" stroke="#e59866" stroke-width="2.5" filter="url(#shadow)" />
  <ellipse cx="300" cy="170" rx="90" ry="24" fill="#a04000" stroke="#d35400" stroke-width="3" />

  <!-- Rich Tangy Prawns Curry Gravy Surface -->
  <ellipse cx="300" cy="170" rx="84" ry="20" fill="url(#curryGravy)" />

  <!-- Juicy Prawns Floating in Gravy -->
  <path d="M 260 160 C 240 175 270 195 290 180 C 275 175 270 165 260 160 Z" fill="url(#prawn)" stroke="#ffffff" stroke-width="1" />
  <path d="M 310 155 C 290 170 320 190 340 175 C 325 170 320 160 310 155 Z" fill="url(#prawn)" stroke="#ffffff" stroke-width="1" />
  <path d="M 280 172 C 260 187 290 205 310 190 C 295 185 290 177 280 172 Z" fill="url(#prawn)" stroke="#ffffff" stroke-width="1" />

  <!-- Fresh Cream Swirl & Coriander Leaves -->
  <path d="M 260 170 Q 300 185 340 165" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9" />
  <circle cx="285" cy="168" r="3" fill="#2ecc71" />
  <circle cx="315" cy="172" r="3.5" fill="#2ecc71" />
  <circle cx="300" cy="162" r="2.5" fill="#d4a843" />

  <!-- Title Badge -->
  <rect x="20" y="20" width="200" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🥘 PRAWNS CURRY</text>
</svg>
