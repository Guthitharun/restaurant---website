<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a05" />
      <stop offset="50%" stop-color="#2a1408" />
      <stop offset="100%" stop-color="#090301" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fishRoast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d35400" />
      <stop offset="50%" stop-color="#a04000" />
      <stop offset="100%" stop-color="#6e2c00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#goldGlow)" />

  <!-- Cast Iron Tawa Plate -->
  <ellipse cx="300" cy="240" rx="200" ry="115" fill="#1c2833" stroke="#5d6d7e" stroke-width="4" filter="url(#shadow)" />
  <ellipse cx="300" cy="240" rx="180" ry="100" fill="#17202a" />

  <!-- 3 Crispy Fish Fry Steaks (Fish Cutlets with Masala Scratches) -->
  <!-- Piece 1 (Left) -->
  <g filter="url(#shadow)">
    <path d="M 170 210 Q 210 180 240 220 Q 220 260 175 250 Z" fill="url(#fishRoast)" stroke="#e74c3c" stroke-width="2" />
    <!-- Masala grill marks -->
    <line x1="185" y1="205" x2="225" y2="235" stroke="#4a1a04" stroke-width="3" />
    <line x1="195" y1="200" x2="235" y2="230" stroke="#4a1a04" stroke-width="3" />
  </g>

  <!-- Piece 2 (Center Big Steak) -->
  <g filter="url(#shadow)">
    <path d="M 240 210 Q 300 170 350 225 Q 320 270 250 260 Z" fill="url(#fishRoast)" stroke="#e74c3c" stroke-width="2" />
    <line x1="265" y1="200" x2="325" y2="240" stroke="#4a1a04" stroke-width="3.5" />
    <line x1="280" y1="190" x2="340" y2="230" stroke="#4a1a04" stroke-width="3.5" />
    <line x1="295" y1="185" x2="345" y2="220" stroke="#4a1a04" stroke-width="3.5" />
  </g>

  <!-- Piece 3 (Right Steak) -->
  <g filter="url(#shadow)">
    <path d="M 345 220 Q 390 190 425 225 Q 405 265 355 255 Z" fill="url(#fishRoast)" stroke="#e74c3c" stroke-width="2" />
    <line x1="365" y1="210" x2="405" y2="240" stroke="#4a1a04" stroke-width="3" />
    <line x1="375" y1="200" x2="415" y2="230" stroke="#4a1a04" stroke-width="3" />
  </g>

  <!-- Lemon Wedges & Curry Leaves -->
  <circle cx="440" cy="250" r="22" fill="#f1c40f" stroke="#f39c12" stroke-width="3" />
  <path d="M 230 260 Q 280 275 340 265" stroke="#2ecc71" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="270" cy="268" r="3" fill="#ffffff" />
  <circle cx="310" cy="270" r="3.5" fill="#ffffff" />

  <!-- Title Badge -->
  <rect x="20" y="20" width="200" height="38" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1" />
  <text x="32" y="44" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#d4a843">🐟 FISH FRY (3 PCS)</text>
</svg>
